name: Sunthetics
description: >-
  Sunthetics is an AI/ML platform for optimizing chemical experiments and R&D
  processes. Its cloud-based, no-code product SuntheticsML applies Bayesian
  optimization and design-of-experiments (DOE) techniques to small datasets,
  helping scientists identify the variables that matter most and recommend the
  highest-impact next experiments. The company reports up to 99% prediction
  accuracy, up to a 97% reduction in the number of experiments versus
  traditional methods, and materially faster optimization campaigns across
  reaction-agnostic chemistry and materials workflows. Sunthetics is a Techstars
  portfolio company and was added to the API Evangelist network as a company
  profile. As of this enrichment pass the company publishes no public API,
  developer portal, or OpenAPI specification; its product is delivered as a web
  application at sunthetics-app.com.
